<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NS Severe Weather Alerts</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 1rem; }
    .alert-item { border: 1px solid #ddd; padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 6px; }
    .alert-title { font-weight: bold; margin-bottom: 0.25rem; }
    .alert-date { color: #666; font-size: 0.9em; margin-bottom: 0.25rem; }
    .alert-desc { margin-bottom: 0.25rem; }
    .alert-link a { color: #1a0dab; text-decoration: none; }
    #refreshBtn { padding: 0.5rem 1rem; font-size: 1rem; }
    #alerts-loader { display: none; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>NS Severe Weather Alerts</h1>
  <button id="refreshBtn">Refresh Alerts</button>
  <span id="alerts-loader" aria-label="loading" role="status">Loading…</span>
  <div id="alerts" aria-live="polite" style="margin-top: 1rem;">
    <!-- Alerts will be injected here -->
  </div>

  <script src="script.js"></script>
</body>
</html>
